<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101309" />
    <meta
      name="description"
      content="ESMAR — долевое управление недвижимостью Кыргызстана: договор доверительного управления, ставка до 55% годовых, лицензия Финнадзора КР №88."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ESMAR — долевое управление недвижимостью</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Тема и язык выставляются до первой отрисовки, иначе при сохранённой
         светлой теме экран успевает моргнуть чёрным. */
      try {
        var t = localStorage.getItem("esmar-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = t === "light" ? "#f4f1ea" : "#101309";
        }
        var l = localStorage.getItem("esmar-lang");
        if (l === "ru" || l === "ky") document.documentElement.lang = l;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
